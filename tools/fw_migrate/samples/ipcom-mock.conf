! 模擬 IPCOM EX の設定(変換ツールの試験用。実機の構文と細部が違う可能性がある)
! 公開情報で確かめられたのは class-map で条件を作り、interface に
! "rule access <番号> in <class-map> accept audit-session-normal audit-match-none" を当てる骨格と、
! ルールを当てると暗黙の deny が入ることだけ。match の細かい書き方は模擬。
hostname IPCOM-HQ
user admin password 0 Hq-Adm1n-2026!
snmp-server community hq-ro-community ro
!
interface lan0.0
 description WAN
 ip address 203.0.113.2/29
 rule access 100 in web-in accept audit-session-normal audit-match-none
 rule access 110 in mail-in accept audit-session-normal audit-match-none
 rule access 120 in ssh-deny drop audit-session-none audit-match-normal
 exit
interface lan0.1
 description LAN
 ip address 192.168.10.1/24
 rule access 200 in lan-smb-block reject audit-session-none audit-match-normal
 rule access 210 in lan-out accept audit-session-normal audit-match-none
 exit
interface lan0.2
 description DMZ
 ip address 172.16.20.1/24
 rule access 300 in dmz-dns accept audit-session-normal audit-match-none
 exit
!
class-map match-all web-in
 match source-address ip any
 match destination-address ip 172.16.20.10/32
 match destination-port 80/tcp 443/tcp
 exit
class-map match-all mail-in
 match source-address ip any
 match destination-address ip 172.16.20.11/32
 match destination-port 25/tcp
 exit
class-map match-all ssh-deny
 match source-address ip any
 match destination-address ip any
 match destination-port 22/tcp
 exit
class-map match-all lan-smb-block
 match source-address ip 192.168.10.0/24
 match destination-address ip any
 match destination-port 445/tcp
 exit
class-map match-all lan-out
 match source-address ip 192.168.10.0/24
 match destination-address ip any
 exit
class-map match-all dmz-dns
 match source-address ip 172.16.20.0/24
 match destination-address ip any
 match destination-port 53/udp 53/tcp
 exit
!
ip route 0.0.0.0/0 203.0.113.1
nat static 203.0.113.3 172.16.20.10
ipsec peer 198.51.100.1 pre-shared-key Br4nch-PSK-xyz
